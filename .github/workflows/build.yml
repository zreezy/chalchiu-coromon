on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: ["**"]

name: Build
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      LLVM_MINGW: llvm-mingw-20241217-ucrt-ubuntu-20.04-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check mods against the latest game docs
        run: |
          latest=$(ls docs/game | grep -E '^[0-9]' | sort -V | tail -1)
          python3 tools/gamedocs/gamedocs.py check scripts/coromon --version "$latest"

      - name: Install llvm-mingw
        run: |
          curl -sSL -o llvm-mingw.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/20241217/${LLVM_MINGW}.tar.xz"
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xf llvm-mingw.tar.xz -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          echo "$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Compile
        run: |
          cmake -S . -B build -DIS_CI=1 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain.cmake
          cmake --build build --config Release -j

      - name: Check imports
        run: i686-w64-mingw32-objdump -p build/iphlpapi.dll | grep "DLL Name"

      - name: Package
        run: |
          mkdir -p package/mods package/optional
          cp build/iphlpapi.dll package/
          cp -r scripts/coromon/* package/mods/
          cp -r scripts/debug package/optional/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chalchiu
          path: package/

  release:
    # Every successful build of master becomes a GitHub release with a ready-to-install zip
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: chalchiu
          path: package/

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^project(.*VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          short_sha=$(git rev-parse --short HEAD)

          (cd package && zip -qr "../chalchiu-${tag}.zip" .)

          {
            echo "Automatic build of \`${short_sha}\` from master."
            echo
            echo "## Install"
            echo
            echo "1. Back up your Coromon saves."
            echo "2. Unzip into the game folder (e.g. \`C:\\Program Files (x86)\\Steam\\steamapps\\common\\Coromon\`), next to \`coromon.exe\`."
            echo "3. Mods go in \`mods/\`. The \`optional/\` folder has extra mods (e.g. \`debug\`) you can copy into \`mods/\` if you want them."
            echo "4. Start the game. A \`chalchiu.log\` file is created, and the window title shows how many mods loaded."
            echo
            echo "## Changes"
            echo
            git log -1 --format='%s%n%n%b'
          } > notes.md

          gh release create "$tag" "chalchiu-${tag}.zip" \
            --target "$GITHUB_SHA" \
            --title "chalchiu ${version} (build ${GITHUB_RUN_NUMBER})" \
            --notes-file notes.md \
            --latest
