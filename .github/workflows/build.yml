on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: ["**"]

name: Build
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      LLVM_MINGW: llvm-mingw-20241217-ucrt-ubuntu-20.04-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run offline tests (runtime + mods)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1 > /dev/null
          lua5.1 tests/run.lua .

      - name: Check mods against the latest game docs
        run: |
          latest=$(ls docs/game | grep -E '^[0-9]' | sort -V | tail -1)
          python3 tools/gamedocs/gamedocs.py check scripts/coromon --version "$latest"

      - name: Install llvm-mingw
        run: |
          curl -sSL -o llvm-mingw.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/20241217/${LLVM_MINGW}.tar.xz"
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xf llvm-mingw.tar.xz -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          echo "$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Compile
        run: |
          cmake -S . -B build -DIS_CI=1 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain.cmake
          cmake --build build --config Release -j

      - name: Check imports
        run: i686-w64-mingw32-objdump -p build/iphlpapi.dll | grep "DLL Name"

      - name: Package
        run: |
          mkdir -p package/mods package/optional
          cp build/iphlpapi.dll package/
          cp -r scripts/coromon/* package/mods/
          cp -r scripts/debug package/optional/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chalchiu
          path: package/

  release:
    # Publishes a release only when the version in CMakeLists.txt changes (tag v<version>).
    # Other pushes still build and upload the "chalchiu" artifact, but don't add a release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^project(.*VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release ${tag} already exists, nothing to publish. Bump VERSION in CMakeLists.txt to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Artifact
        if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: chalchiu
          path: package/

      - name: Create Release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          (cd package && zip -qr "../chalchiu-${TAG}.zip" .)

          # Release notes: the matching "## [x.y.z]" section of CHANGELOG.md
          changes=$(awk -v v="$VERSION" '
            /^## \[/ { found = index($0, "[" v "]") > 0; next }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$changes" ]; then
            changes=$(git log -1 --format='%s%n%n%b')
          fi

          {
            echo "## Install"
            echo
            echo "1. Back up your Coromon saves."
            echo "2. Unzip into the game folder (e.g. \`C:\\Program Files (x86)\\Steam\\steamapps\\common\\Coromon\`), next to \`coromon.exe\`."
            echo "3. Mods go in \`mods/\`. The \`optional/\` folder has extra mods (e.g. \`debug\`) you can copy into \`mods/\` if you want them."
            echo "4. Start the game. A \`chalchiu.log\` file is created, and the window title shows the chalchiu version and how many mods loaded."
            echo
            echo "When updating, unzip over the old files. Your mod settings (\`mods/<mod>/settings.lua\`) are not in the zip, so they are kept."
            echo
            echo "## Changes"
            echo "$changes"
          } > notes.md

          gh release create "$TAG" "chalchiu-${TAG}.zip" \
            --target "$GITHUB_SHA" \
            --title "chalchiu ${VERSION}" \
            --notes-file notes.md \
            --latest
